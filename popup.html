<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Partner Screening</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      background-color: #ffffff;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .version {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    #result {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.45;
      color: #334155;
      max-height: 380px;
      overflow-y: auto;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
    }
    .badge-approved { background: #dcfce7; color: #166534; }
    .badge-rejected { background: #fee2e2; color: #991b1b; }
    .badge-review { background: #fef3c7; color: #92400e; }
    .check-row {
      margin-top: 3px;
    }
    .section-checks {
      margin-top: 10px;
      border-top: 1px solid #e2e8f0;
      padding-top: 8px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>Doc Screening AI</h3>
    <span class="version">v2.1</span>
  </div>
  <button id="btn-verify">🔍 Verify Full Profile</button>
  <div id="result">Ready to audit documents.</div>
  <script src="popup.js"></script>
</body>
</html>
